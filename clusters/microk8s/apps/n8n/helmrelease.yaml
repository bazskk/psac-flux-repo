apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: n8n
  namespace: n8n
spec:
  interval: 10m
  chart:
    spec:
      chart: n8n
      version: "1.14.0"
      sourceRef:
        kind: HelmRepository
        name: n8n
        namespace: flux-system
  values:
    queueMode:
      enabled: false
    database:
      type: sqlite
      useExternal: false
    redis:
      enabled: false
    persistence:
      enabled: true
      size: 5Gi
    ingress:
      enabled: false
    secretRefs:
      existingSecret: n8n-secrets
